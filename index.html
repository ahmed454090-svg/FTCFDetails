<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <link rel="manifest" href="manifest.json">
    <title>FTCF | Professional Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;800&display=swap');
        body { background-color: #050505; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        
        #splash { 
            position: fixed; inset: 0; z-index: 9999; 
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.4s ease-in-out; 
        }
        
        .circle-container { position: relative; width: 130px; height: 130px; display: flex; justify-content: center; align-items: center; }
        .circle { position: absolute; border: 3px solid transparent; border-radius: 50%; animation: rotate 3s linear infinite; }
        .circle-1 { width: 100%; height: 100%; border-top: 3px solid #ffffff; }
        .circle-2 { width: 85%; height: 85%; border-bottom: 3px solid #f59e0b; animation-direction: reverse; }
        .ftcf-text { font-size: 1.75rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }
        
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .tab-content { display: none; height: 100vh; width: 100vw; }
        .tab-content.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .luxury-nav { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; opacity: 0.6; }
        .tab-btn:hover { color: #ffffff; opacity: 1; }
        .tab-btn.active-tab { color: #f59e0b !important; opacity: 1 !important; transform: translateY(-3px); }
        .glass-card { background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.12); }
        
        .bell-container { position: relative; }
        .red-dot { position: absolute; top: 0px; right: 0px; width: 9px; height: 9px; background: #ef4444; border-radius: 50%; border: 2px solid #050505; }
    </style>
</head>
<body class="text-slate-200">

    <!-- Splash Screen -->
    <div id="splash">
        <div class="circle-container">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="ftcf-text">FTCF</div>
        </div>
        <p class="text-amber-500 font-mono text-sm tracking-widest mt-6 font-bold uppercase">Family Trust Portal</p>
    </div>

    <!-- Quick Action Controls -->
    <div class="fixed top-5 right-5 z-[60] flex gap-3">
        <button id="installBtn" class="hidden w-10 h-10 rounded-full bg-black/40 border border-white/10 text-slate-300 hover:text-amber-500 backdrop-blur-md transition-all">
            <i class="fas fa-download"></i>
        </button>
        <button onclick="toggleModal('bank-popup', true)" class="w-10 h-10 rounded-full bg-black/40 border border-white/10 text-slate-300 hover:text-amber-500 backdrop-blur-md transition-all">
            <i class="fas fa-university"></i>
        </button>
        <button onclick="toggleModal('notice-popup', true)" class="w-10 h-10 rounded-full bg-black/40 border border-white/10 text-slate-300 hover:text-amber-500 backdrop-blur-md bell-container transition-all">
            <i class="fas fa-bell"></i>
            <span class="red-dot"></span>
        </button>
    </div>

    <!-- Bank Modal -->
    <div id="bank-popup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-md">
        <div class="glass-card p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-white text-lg font-bold mb-4 flex items-center justify-center gap-2">
                <i class="fas fa-university text-amber-500"></i> HBL Konnect Details
            </h2>
            <div class="bg-black/40 p-4 rounded-2xl text-left border border-white/5 space-y-2 mb-6">
                <div>
                    <span class="text-xs text-slate-400 block">Account Title</span>
                    <span class="text-sm text-white font-semibold">Afzaal Ahmed</span>
                </div>
                <div class="pt-2 border-t border-white/5">
                    <span class="text-xs text-slate-400 block">Account / Mobile Number</span>
                    <span class="text-sm text-amber-400 font-mono font-bold">0342-2735966</span>
                </div>
            </div>
            <button onclick="toggleModal('bank-popup', false)" class="w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl text-white font-semibold transition-all">Close</button>
        </div>
    </div>

    <!-- Notice Modal -->
    <div id="notice-popup" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-md">
        <div class="glass-card p-6 rounded-3xl w-full max-w-sm shadow-2xl">
            <h2 class="text-white text-lg font-bold mb-3 flex items-center gap-2">
                <i class="fas fa-bullhorn text-amber-500"></i> System Notice
            </h2>
            <p class="text-slate-300 text-sm leading-relaxed mb-6">
                Alhamdulillah! FTCF portal updates complete ho chuki hain. Safe aur fast browsing ke liye caching ko optimize kiya gaya hai.
            </p>
            <button onclick="toggleModal('notice-popup', false)" class="w-full py-3 bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 rounded-xl font-semibold transition-all">Acknowledge</button>
        </div>
    </div>

    <!-- Tab Contents (Lazy Loaded) -->
    <div id="ledger" class="tab-content" data-src="https://ftcf20-hub.github.io/FTCF.com/"></div>
    <div id="monthly" class="tab-content" data-src="https://ftcf20-hub.github.io/Monthly-Status/"></div>
    <div id="yearly" class="tab-content" data-src="https://ftcf20-hub.github.io/Yearly-Record/"></div>
    <div id="rules" class="tab-content" data-src="https://ftcf20-hub.github.io/Loneportal/"></div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-6 left-6 right-6 luxury-nav rounded-2xl flex justify-between items-center z-[99] h-16 px-6 shadow-2xl border border-white/10 max-w-md mx-auto">
        <div class="flex gap-6">
            <button data-target="ledger" onclick="switchTab('ledger', this)" class="tab-btn p-2"><i class="fas fa-wallet text-xl"></i></button>
            <button data-target="monthly" onclick="switchTab('monthly', this)" class="tab-btn p-2"><i class="fas fa-calendar-check text-xl"></i></button>
        </div>
        <a href="https://chat.whatsapp.com/KuEfcgvGkOQHFY03h4IuHV?s=cl&p=a&ilr=1&amv=3" target="_blank" class="bg-amber-500 text-black w-12 h-12 flex items-center justify-center rounded-xl font-bold shadow-lg hover:bg-amber-400 transition-all -translate-y-2">
            <i class="fab fa-whatsapp text-2xl"></i>
        </a>
        <div class="flex gap-6">
            <button data-target="yearly" onclick="switchTab('yearly', this)" class="tab-btn p-2"><i class="fas fa-chart-line text-xl"></i></button>
            <button data-target="rules" onclick="switchTab('rules', this)" class="tab-btn p-2"><i class="fas fa-gavel text-xl"></i></button>
        </div>
    </nav>

    <script>
        // Tab Switcher with Lazy Load Feature
        function switchTab(id, btnElement) { 
            if (navigator.vibrate) navigator.vibrate(15); 
            
            // Hide all tab containers
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab')); 
            
            const targetContainer = document.getElementById(id);
            targetContainer.classList.add('active');
            
            // Lazy load iframe content if not loaded yet
            if (!targetContainer.querySelector('iframe')) {
                const iframe = document.createElement('iframe');
                iframe.src = targetContainer.getAttribute('data-src');
                targetContainer.appendChild(iframe);
            }
            
            if (btnElement) {
                btnElement.classList.add('active-tab');
            }
            
            localStorage.setItem('activeTab', id); 
        }

        // Modal Handler
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // Initial Setup
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash');
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 400);
            }, 800);

            const lastTab = localStorage.getItem('activeTab') || 'ledger';
            const targetBtn = document.querySelector(`button[data-target="${lastTab}"]`);
            switchTab(lastTab, targetBtn);
        });

        // PWA Installation Hook
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { 
            e.preventDefault(); 
            deferredPrompt = e; 
            document.getElementById('installBtn').classList.remove('hidden'); 
        });

        document.getElementById('installBtn').addEventListener('click', () => { 
            if (deferredPrompt) { 
                deferredPrompt.prompt(); 
                deferredPrompt.userChoice.then((choiceResult) => { 
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBtn').classList.add('hidden');
                    }
                }); 
            } 
        });
    </script>
</body>
</html>
